[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E731"]  # FastAPI Depends() defaults; small lambdas in tests

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
