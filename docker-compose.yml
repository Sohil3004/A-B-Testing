services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: experimentiq
      POSTGRES_PASSWORD: experimentiq
      POSTGRES_DB: experimentiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experimentiq -d experimentiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://experimentiq:experimentiq@db:5432/experimentiq
      API_KEY: ${API_KEY:-dev-secret-key}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  seed:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://experimentiq:experimentiq@db:5432/experimentiq
    command: ["python", "-m", "simulator.simulate", "--scale", "0.5"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${API_KEY:-dev-secret-key}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
