databases:
  - name: experimentiq-db
    plan: free
    databaseName: experimentiq
    user: experimentiq

services:
  - type: web
    name: experimentiq-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m simulator.simulate --scale 0.2 && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: experimentiq-db
          property: connectionString
      - key: API_KEY
        value: dev-secret-key
      - key: CORS_ORIGINS
        value: "*"
