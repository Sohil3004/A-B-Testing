databases:
  - name: experimentiq-db
    plan: free
    databaseName: experimentiq
    user: experimentiq

services:
  - type: web
    name: experimentiq-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: experimentiq-db
          property: connectionString
      - key: API_KEY
        value: dev-secret-key
      - key: CORS_ORIGINS
        value: "*"
